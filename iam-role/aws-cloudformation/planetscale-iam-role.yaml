AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM Role for PlanetScale to perform database snapshot restoration and migration setup. This role uses cross-account assume role with external ID for secure access. (Generated by Liftoff Migration Reviewer)'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "PlanetScale Access Configuration"
        Parameters:
          - PlanetScaleAccountId
          - ExternalId
      - Label:
          default: "Resource Restrictions"
        Parameters:
          - ResourcePrefix
    ParameterLabels:
      PlanetScaleAccountId:
        default: "PlanetScale AWS Account ID"
      ExternalId:
        default: "External ID (Shared Secret)"
      ResourcePrefix:
        default: "Resource Name Prefix"
  Generated:
    Tool: 'PlanetScale migration-scripts (static publish of Liftoff IAM generators)'
    Source: 'planetscale/liftoff-migration-reviewer PR #355'
    Purpose: 'Grant PlanetScale least-privilege access for database migration'

Parameters:
  PlanetScaleAccountId:
    Type: String
    Default: '123456789012'
    Description: 'PlanetScale AWS account ID (provided by PlanetScale support team)'
    AllowedPattern: '\d{12}'
    ConstraintDescription: 'Must be a valid 12-digit AWS account ID'

  ExternalId:
    Type: String
    Description: 'Unique external ID for secure cross-account access (generate with: uuidgen or openssl rand -hex 32). Share this with PlanetScale support.'
    MinLength: 16
    MaxLength: 128
    AllowedPattern: '[a-zA-Z0-9-_]+'
    ConstraintDescription: 'Must be 16-128 characters, alphanumeric with hyphens and underscores only'

  ResourcePrefix:
    Type: String
    Default: 'planetscale-migration'
    Description: 'Prefix for all resources created by PlanetScale (restricts what PlanetScale can create)'
    AllowedPattern: '[a-z0-9-]+'
    ConstraintDescription: 'Must be lowercase alphanumeric with hyphens only'

Resources:
  PlanetScaleMigrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-role'
      Description: 'Allows PlanetScale to restore RDS/Aurora snapshots for migration POC testing'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${PlanetScaleAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      MaxSessionDuration: 43200  # 12 hours
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-role'
        - Key: Purpose
          Value: 'PlanetScale Migration Access'
        - Key: ManagedBy
          Value: 'CloudFormation'

  PlanetScaleMigrationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ResourcePrefix}-policy'
      Roles:
        - !Ref PlanetScaleMigrationRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # CloudFormation account-level actions (no resource-level permissions supported).
          # CreateUploadBucket / GetTemplateSummary / ValidateTemplate are required by
          # the AWS CLI (aws cloudformation deploy / package) and the console template
          # upload flow, which stages templates in an AWS-managed cf-templates-* bucket.
          - Sid: CloudFormationAccountLevel
            Effect: Allow
            Action:
              - 'cloudformation:ListStacks'
              - 'cloudformation:CreateUploadBucket'
              - 'cloudformation:GetTemplateSummary'
              - 'cloudformation:ValidateTemplate'
            Resource: '*'

          # CloudFormation describe operations (scoped to prefix - prevents viewing other stack details)
          - Sid: CloudFormationDescribe
            Effect: Allow
            Action:
              - 'cloudformation:DescribeStacks'
            Resource: !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${ResourcePrefix}-*/*'

          # CloudFormation stack + change set management.
          # Change set actions are required by "aws cloudformation deploy", which creates
          # a change set, describes/executes it, then deletes it.
          - Sid: CloudFormationStackManagement
            Effect: Allow
            Action:
              - 'cloudformation:CreateStack'
              - 'cloudformation:UpdateStack'
              - 'cloudformation:DeleteStack'
              - 'cloudformation:DescribeStackEvents'
              - 'cloudformation:DescribeStackResources'
              - 'cloudformation:DescribeStackResource'
              - 'cloudformation:ListStackResources'
              - 'cloudformation:GetTemplate'
              - 'cloudformation:CreateChangeSet'
              - 'cloudformation:DescribeChangeSet'
              - 'cloudformation:ExecuteChangeSet'
              - 'cloudformation:DeleteChangeSet'
              - 'cloudformation:ListChangeSets'
            Resource: !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${ResourcePrefix}-*/*'

          # RDS snapshot and database read permissions (list and describe)
          - Sid: RDSSnapshotRead
            Effect: Allow
            Action:
              - 'rds:DescribeDBSnapshots'
              - 'rds:DescribeDBClusterSnapshots'
              - 'rds:DescribeDBInstances'
              - 'rds:DescribeDBClusters'
              - 'rds:DescribeDBSubnetGroups'
              - 'rds:DescribeDBEngineVersions'
              - 'rds:DescribeOrderableDBInstanceOptions'
              - 'rds:DescribeEvents'
              - 'rds:DescribeValidDBInstanceModifications'
              - 'rds:ListTagsForResource'
            Resource: '*'

          # RDS instance and cluster creation from snapshots (restricted by prefix)
          - Sid: RDSInstanceManagement
            Effect: Allow
            Action:
              - 'rds:RestoreDBInstanceFromDBSnapshot'
              - 'rds:RestoreDBClusterFromSnapshot'
              - 'rds:CreateDBInstance'
              - 'rds:CreateDBCluster'
              - 'rds:ModifyDBInstance'
              - 'rds:ModifyDBCluster'
              - 'rds:RebootDBInstance'
              - 'rds:RebootDBCluster'
              - 'rds:StartDBInstance'
              - 'rds:StopDBInstance'
              - 'rds:StartDBCluster'
              - 'rds:StopDBCluster'
              - 'rds:DeleteDBInstance'
              - 'rds:DeleteDBCluster'
              - 'rds:AddTagsToResource'
              - 'rds:RemoveTagsFromResource'
            Resource:
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:db:${ResourcePrefix}-*'
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:cluster:${ResourcePrefix}-*'
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:subgrp:${ResourcePrefix}-*'
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:pg:${ResourcePrefix}-*'
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:cluster-pg:${ResourcePrefix}-*'
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:snapshot:*'
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:cluster-snapshot:*'

          # RDS subnet group management (restricted by prefix)
          - Sid: RDSSubnetGroupManagement
            Effect: Allow
            Action:
              - 'rds:CreateDBSubnetGroup'
              - 'rds:DeleteDBSubnetGroup'
              - 'rds:ModifyDBSubnetGroup'
              - 'rds:AddTagsToResource'
              - 'rds:RemoveTagsFromResource'
            Resource: !Sub 'arn:aws:rds:*:${AWS::AccountId}:subgrp:${ResourcePrefix}-*'

          # RDS parameter group describe operations (list/describe need broad access)
          - Sid: RDSParameterGroupDescribe
            Effect: Allow
            Action:
              - 'rds:DescribeDBParameterGroups'
              - 'rds:DescribeDBClusterParameterGroups'
              - 'rds:DescribeDBParameters'
              - 'rds:DescribeDBClusterParameters'
              - 'rds:DescribeEngineDefaultParameters'
              - 'rds:DescribeEngineDefaultClusterParameters'
            Resource: '*'

          # RDS parameter group management (for logical replication settings)
          - Sid: RDSParameterGroupManagement
            Effect: Allow
            Action:
              - 'rds:CreateDBParameterGroup'
              - 'rds:CreateDBClusterParameterGroup'
              - 'rds:ModifyDBParameterGroup'
              - 'rds:ModifyDBClusterParameterGroup'
              - 'rds:DeleteDBParameterGroup'
              - 'rds:DeleteDBClusterParameterGroup'
              - 'rds:AddTagsToResource'
              - 'rds:RemoveTagsFromResource'
            Resource:
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:pg:${ResourcePrefix}-*'
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:cluster-pg:${ResourcePrefix}-*'

          # EC2 VPC and network read permissions (needed for console and connectivity validation)
          - Sid: EC2VPCRead
            Effect: Allow
            Action:
              - 'ec2:DescribeVpcs'
              - 'ec2:DescribeSubnets'
              - 'ec2:DescribeSecurityGroups'
              - 'ec2:DescribeSecurityGroupRules'
              - 'ec2:DescribeAvailabilityZones'
              - 'ec2:DescribeRouteTables'
              - 'ec2:DescribeInternetGateways'
              - 'ec2:DescribeNatGateways'
              - 'ec2:DescribeAddresses'
              - 'ec2:DescribeVpnGateways'
            Resource: '*'

          # EC2 Security Group creation/deletion
          # Note: No tag condition as CloudFormation may create resources before tagging
          - Sid: EC2SecurityGroupCreateDelete
            Effect: Allow
            Action:
              - 'ec2:CreateSecurityGroup'
              - 'ec2:DeleteSecurityGroup'
            Resource:
              - !Sub 'arn:aws:ec2:*:${AWS::AccountId}:security-group/*'
              - !Sub 'arn:aws:ec2:*:${AWS::AccountId}:vpc/*'

          # EC2 Tagging for all resources we create
          - Sid: EC2Tagging
            Effect: Allow
            Action:
              - 'ec2:CreateTags'
              - 'ec2:DeleteTags'
            Resource:
              - !Sub 'arn:aws:ec2:*:${AWS::AccountId}:instance/*'
              - !Sub 'arn:aws:ec2:*:${AWS::AccountId}:volume/*'
              - !Sub 'arn:aws:ec2:*:${AWS::AccountId}:network-interface/*'
              - !Sub 'arn:aws:ec2:*:${AWS::AccountId}:security-group/*'

          # EC2 Security Group rule management (no tag condition as rules don't support tags)
          - Sid: EC2SecurityGroupRuleManagement
            Effect: Allow
            Action:
              - 'ec2:AuthorizeSecurityGroupIngress'
              - 'ec2:AuthorizeSecurityGroupEgress'
              - 'ec2:RevokeSecurityGroupIngress'
              - 'ec2:RevokeSecurityGroupEgress'
            Resource:
              - !Sub 'arn:aws:ec2:*:${AWS::AccountId}:security-group/*'
              - !Sub 'arn:aws:ec2:*:${AWS::AccountId}:security-group-rule/*'

          # EC2 instance operations (for pgcopydb migration instances)
          - Sid: EC2InstanceManagement
            Effect: Allow
            Action:
              - 'ec2:RunInstances'
              - 'ec2:TerminateInstances'
              - 'ec2:StartInstances'
              - 'ec2:StopInstances'
              - 'ec2:RebootInstances'
              - 'ec2:DescribeInstances'
              - 'ec2:DescribeInstanceStatus'
              - 'ec2:DescribeInstanceTypes'
              - 'ec2:DescribeInstanceAttribute'
              - 'ec2:ModifyInstanceAttribute'
              - 'ec2:DescribeImages'
              - 'ec2:DescribeKeyPairs'
              - 'ec2:CreateNetworkInterface'
              - 'ec2:DeleteNetworkInterface'
              - 'ec2:DescribeNetworkInterfaces'
            Resource: '*'

          # EC2 volume management (for EBS volumes on pgcopydb instances)
          - Sid: EC2VolumeManagement
            Effect: Allow
            Action:
              - 'ec2:CreateVolume'
              - 'ec2:DeleteVolume'
              - 'ec2:AttachVolume'
              - 'ec2:DetachVolume'
              - 'ec2:DescribeVolumes'
              - 'ec2:DescribeVolumeStatus'
              - 'ec2:ModifyVolume'
            Resource: '*'

          # IAM role and policy management (for EC2 instance roles)
          - Sid: IAMRoleManagementForEC2
            Effect: Allow
            Action:
              - 'iam:CreateRole'
              - 'iam:DeleteRole'
              - 'iam:GetRole'
              - 'iam:PutRolePolicy'
              - 'iam:DeleteRolePolicy'
              - 'iam:GetRolePolicy'
              - 'iam:AttachRolePolicy'
              - 'iam:DetachRolePolicy'
              - 'iam:ListAttachedRolePolicies'
              - 'iam:ListRolePolicies'
              - 'iam:TagRole'
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ResourcePrefix}-*'

          # IAM instance profile management (for EC2 instances)
          - Sid: IAMInstanceProfileManagement
            Effect: Allow
            Action:
              - 'iam:CreateInstanceProfile'
              - 'iam:DeleteInstanceProfile'
              - 'iam:GetInstanceProfile'
              - 'iam:AddRoleToInstanceProfile'
              - 'iam:RemoveRoleFromInstanceProfile'
              - 'iam:ListInstanceProfiles'
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:instance-profile/${ResourcePrefix}-*'

          # IAM PassRole for EC2 instances
          - Sid: IAMPassRoleForEC2
            Effect: Allow
            Action:
              - 'iam:PassRole'
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ResourcePrefix}-*'
            Condition:
              StringEquals:
                'iam:PassedToService': 'ec2.amazonaws.com'

          # EC2 Instance Connect (for console "Connect" button)
          - Sid: EC2InstanceConnect
            Effect: Allow
            Action:
              - 'ec2-instance-connect:SendSSHPublicKey'
              - 'ec2-instance-connect:SendSerialConsoleSSHPublicKey'
            Resource: !Sub 'arn:aws:ec2:*:${AWS::AccountId}:instance/*'

          # Systems Manager access (for EC2 Session Manager and AMI parameter resolution)
          - Sid: SSMAccess
            Effect: Allow
            Action:
              - 'ssm:DescribeInstanceInformation'
              - 'ssm:DescribeInstanceProperties'
              - 'ssm:DescribeSessions'
              - 'ssm:GetConnectionStatus'
              - 'ssm:GetParameter'
              - 'ssm:GetParameters'
              - 'ssm:StartSession'
              - 'ssm:TerminateSession'
              - 'ssm:ResumeSession'
            Resource: '*'

          # CloudWatch metrics and monitoring (read-only for observability)
          - Sid: CloudWatchMetrics
            Effect: Allow
            Action:
              - 'cloudwatch:GetMetricStatistics'
              - 'cloudwatch:GetMetricData'
              - 'cloudwatch:ListMetrics'
              - 'cloudwatch:DescribeAlarms'
              - 'cloudwatch:DescribeAlarmsForMetric'
              - 'cloudwatch:GetDashboard'
              - 'cloudwatch:ListDashboards'
            Resource: '*'

          # CloudWatch Logs (read-only for debugging and monitoring)
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - 'logs:DescribeLogGroups'
              - 'logs:DescribeLogStreams'
              - 'logs:GetLogEvents'
              - 'logs:FilterLogEvents'
              - 'logs:StartQuery'
              - 'logs:StopQuery'
              - 'logs:GetQueryResults'
              - 'logs:GetLogGroupFields'
            Resource: '*'

          # RDS Enhanced Monitoring, Performance Insights, and Database Insights (read-only)
          - Sid: RDSMonitoring
            Effect: Allow
            Action:
              - 'rds:DescribeDBLogFiles'
              - 'rds:DownloadDBLogFilePortion'
              - 'rds:DownloadCompleteDBLogFile'
              - 'pi:GetResourceMetrics'
              - 'pi:DescribeDimensionKeys'
              - 'pi:GetDimensionKeyDetails'
              - 'pi:ListAvailableResourceMetrics'
              - 'pi:ListAvailableResourceDimensions'
              - 'pi:GetResourceMetadata'
              - 'pi:ListPerformanceAnalysisReports'
              - 'pi:GetPerformanceAnalysisReport'
              - 'pi:ListTagsForResource'
            Resource: '*'

          # KMS permissions for encrypted snapshots (read-only, customer must grant decrypt)
          - Sid: KMSReadAccess
            Effect: Allow
            Action:
              - 'kms:DescribeKey'
              - 'kms:ListAliases'
            Resource: '*'

          # KMS decrypt permission (needed if snapshot is encrypted)
          # Note: Customer must ensure their KMS key policy allows PlanetScale to use it
          - Sid: KMSDecryptForSnapshots
            Effect: Allow
            Action:
              - 'kms:Decrypt'
              - 'kms:CreateGrant'
            Resource: '*'
            Condition:
              StringEquals:
                'kms:ViaService':
                  - !Sub 'rds.${AWS::Region}.amazonaws.com'

          # IAM PassRole (needed for RDS enhanced monitoring if enabled)
          - Sid: IAMPassRoleForRDS
            Effect: Allow
            Action:
              - 'iam:PassRole'
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/rds-monitoring-role'
            Condition:
              StringEquals:
                'iam:PassedToService': 'monitoring.rds.amazonaws.com'

          # S3 bucket for CloudFormation templates (optional - for template storage and audit trail)
          - Sid: S3BucketManagement
            Effect: Allow
            Action:
              - 's3:CreateBucket'
              - 's3:DeleteBucket'
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
              - 's3:GetBucketVersioning'
              - 's3:PutBucketVersioning'
              - 's3:PutBucketPublicAccessBlock'
              - 's3:PutBucketTagging'
              - 's3:GetBucketTagging'
            Resource: !Sub 'arn:aws:s3:::${ResourcePrefix}-*'

          # S3 object operations (for CloudFormation templates and logs)
          - Sid: S3ObjectManagement
            Effect: Allow
            Action:
              - 's3:PutObject'
              - 's3:GetObject'
              - 's3:DeleteObject'
              - 's3:ListMultipartUploadParts'
              - 's3:AbortMultipartUpload'
            Resource: !Sub 'arn:aws:s3:::${ResourcePrefix}-*/*'

          # S3 list all buckets (needed for CloudFormation to validate bucket exists)
          - Sid: S3ListAllBuckets
            Effect: Allow
            Action:
              - 's3:ListAllMyBuckets'
            Resource: '*'

          # S3 access to the AWS-managed CloudFormation templates bucket.
          # Both the AWS CLI ("aws cloudformation deploy") and the CloudFormation console
          # upload templates to a bucket named cf-templates-<hash>-<region>, which is
          # created on first use by cloudformation:CreateUploadBucket. The bucket name is
          # AWS-controlled, so it cannot follow the customer ResourcePrefix convention.
          - Sid: S3CloudFormationTemplatesBucket
            Effect: Allow
            Action:
              - 's3:CreateBucket'
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
              - 's3:GetBucketVersioning'
              - 's3:PutBucketVersioning'
              - 's3:PutBucketPublicAccessBlock'
              - 's3:PutBucketPolicy'
              - 's3:PutBucketTagging'
              - 's3:GetBucketTagging'
            Resource: 'arn:aws:s3:::cf-templates-*'

          - Sid: S3CloudFormationTemplatesObjects
            Effect: Allow
            Action:
              - 's3:PutObject'
              - 's3:GetObject'
              - 's3:DeleteObject'
              - 's3:ListMultipartUploadParts'
              - 's3:AbortMultipartUpload'
            Resource: 'arn:aws:s3:::cf-templates-*/*'

Outputs:
  RoleArn:
    Description: 'IAM Role ARN - Share this with PlanetScale support team'
    Value: !GetAtt PlanetScaleMigrationRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'

  ExternalId:
    Description: 'External ID - Share this with PlanetScale support team (keep confidential)'
    Value: !Ref ExternalId

  ResourcePrefix:
    Description: 'Resource prefix that restricts what PlanetScale can create'
    Value: !Ref ResourcePrefix

  RoleSessionDuration:
    Description: 'Maximum session duration in hours'
    Value: '12 hours'

  NextSteps:
    Description: 'What to do next'
    Value: 'Share the RoleArn and ExternalId with PlanetScale support. PlanetScale will use this role to create database resources with names starting with your ResourcePrefix.'

  SecurityNotes:
    Description: 'Security information'
    Value: !Sub 'This role is restricted to creating resources prefixed with "${ResourcePrefix}-" and requires the ExternalId for access. PlanetScale cannot access existing databases or resources outside this naming convention.'

  RevokeAccess:
    Description: 'How to revoke PlanetScale access'
    Value: 'Delete this CloudFormation stack to immediately revoke all PlanetScale access. Alternatively, modify the ExternalId parameter to invalidate existing sessions.'
